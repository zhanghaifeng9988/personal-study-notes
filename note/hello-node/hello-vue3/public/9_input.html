<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="vue.js"></script>
  <title>表单输入</title>
</head>
<body>
  <div id = "Application">
    <!-- 将输入框中的内容进行双向绑定 -->
    <!-- lazy表示：数据发生变化时，不会立即更新视图，而是等待变化完成后，再进行数据的处理 -->
    <input type="text" v-model.lazy = "message"
      placeholder="enter键或者鼠标左键确认输入"/>
      <p>文本框输入内容：{{ message }}</p>
    <textarea v-model.trim = "textarea"></textarea>
    <p>多行文本输入框内容：{{textarea}} </p>
    <input type="checkbox" value="足球" v-model="checkbox"/>足球
    <input type="checkbox" value="篮球" v-model="checkbox"/>篮球
    <input type="checkbox" value="排球" v-model="checkbox"/>排球
    <p>{{checkbox}}</p>
    <input type="radio" value="男" v-model="sex"/>男
    <input type="radio" value="女" v-model="sex"/>女
    <p>{{sex}}</p>
    <select v-model="select">
      <option value="北京">北京</option>
      <option value="上海">上海</option>
      <option value="广州">广州</option>
    </select>
    <p>{{select}}</p>
  </div>
  <script>
    const App = {
      data() {
        return {
          message:'',
          textarea:'',
          checkbox:[],
          sex:'',
          select:''
        }
      }
    }
    Vue.createApp(App).mount("#Application")
  </script>
</body>
</html>
