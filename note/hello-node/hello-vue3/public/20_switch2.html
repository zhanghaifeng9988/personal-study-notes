<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>switch</title>
  <script src="vue.js"></script>
</head>

<body>
  <div id="Application">
    <switch-component switch-style="mini" background-color="blue" border-color="black" color="blue"
      @switch-change="change1"></switch-component>
    <div>开关状态：{{state1}}</div>
    <br />
    <switch-component switch-style="large" background-color="green" border-color="black" color="green"
      @switch-change="change2"></switch-component>
    <div>开关状态：{{state2}}</div>
  </div>
  <script>
    //创建Vue实例
    const App = Vue.createApp({
      data() {
        return {
          state1: 'off',
          state2: 'off'
        }
      },
      methods: {
        change1(isOpen) {
          this.state1 = isOpen ? 'on' : 'off'
        },
        change2(isOpen) {
          this.state2 = isOpen ? 'on' : 'off'
        }
      }
    })

    //定义开关组件，实现状态属性和样式属性的绑定
    const switchComponent = {
      //定义的外部属性，可以在父组件引用这些属性并给属性赋值
      props: ['switchStyle', 'backgroundColor', 'borderColor', 'color'],
      //内部属性来控制开关的状态
      data() {
        return {
          isOpen: false,
          left: '0px'
        }
      },
      //通过计算属性来设置CSS样式
      computed: {
        cssStylesBG: {
          get() {
            if (this.switchStyle == 'mini') {
              return `position:relative;
                border-color:${this.borderColor};
                border-width:2px;
                border-style:solid;
                width:55px;
                height:30px;
                border-radius:30px;
                background-color :${this.isOpen ? this.backgroundColor : 'white'};`
            }
            else {
              return `position:relative;
                border-color:${this.borderColor};
                border-width:2px;
                border-style:solid;
                width:55px;
                height:30px;
                border-radius:10px;
                background-color:${this.isOpen ? this.backgroundColor : 'white'};`
            }
          }
        },
        cssStyleBtn: {
          get() {
            if (this.switchStyle == 'mini') {
              return `position:absolute;
              width:30px;
              height:30px;
              left:${this.left};
              border-radius:50%;
              background-color:${this.color};`
            }
            else {
              return `position:absolute;
              width:30px;
              height:30px;
              left:${this.left};
              border-radius:8px;
              background-color:${this.color};`
            }
          }
        }
      },
      methods: {
        click() {
          this.isOpen = !this.isOpen;
          this.left = this.isOpen ? '25px' : '0px';
          this.$emit('switchChange', this.isOpen);
        }
      },
      template:
        `<div :style= 'cssStylesBG' @click='click'>
    <div :style= 'cssStyleBtn'></div>
  </div>`
    }
    //创建Vue实例并挂载组件
    App.component('switch-component', switchComponent);
    App.mount('#Application')
  </script>
</body>

</html>
