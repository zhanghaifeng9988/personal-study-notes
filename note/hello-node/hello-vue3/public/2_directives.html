
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模板插值</title>
  <script src="vue.js"></script>
  <style>
        .name {
  color: red;
}
  </style>
</head>
<body>
<div id="Application">
  <!-- 这里使用了条件渲染 -->
  <h1 v-bind:[prop]="name" v-if="show">Hello zhf</h1>
  <h2 v-if="show">Hello Vue3</h2>
</div>
<script>
  // 定义一个Vue组件对象
  const App =  {
    data() {
      return {
        show: true, //控制h1是否显示
        prop: 'class',//
        name: 'name' //
        }
  }
}
// 创建Vue实例并挂载到div上
const app = Vue.createApp(App)
app.mount('#Application')
</script>
</body>
</html>
