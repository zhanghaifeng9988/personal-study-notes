  <script>
    var throttle = false // 限流变量，标记当前是否触发限流
    function throttleTool(callback,timeout) { //包装的限流函数
      if (!throttle) {                    //如果throttle = false，未触发限流，则执行回调函数
        callback()
      }
      else {
        alert('提交中，请等待')
        //return                         //如果触发限流，则返回空函数
      }

    throttle = true                   // 触发限流
    setTimeout(() => {
      throttle = false                // 解除限流
    }, timeout)
  }
function logCurrentTime() {
  alert(Date.now())
}

  const App2 = {
    methods: {
      handleClick() {
        throttleTool(logCurrentTime,3000)
      }
    }
  }
  Vue.createApp(App2).mount('#Application')
  </script>
