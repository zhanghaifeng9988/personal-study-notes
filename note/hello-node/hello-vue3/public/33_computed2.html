<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="vue.js"> </script>
</head>
<body>
  <div id="Application">
  </div>
  <script>
const App = Vue.createApp({
  setup() {
    let a = Vue.ref(1)
    let b = Vue.ref(2)
    let sum = Vue.computed({
      set (value) {
        a.value = value
        b.value = value
      },
      get () {
        return a.value + b.value
      }}
    )
    function click() {
      a.value += 1
      b.value += 2
      alert(a.value)
      alert(b.value)
      if (sum.value > 10){
        sum.value = 0 //对sum计算变量的赋值也会影响a和b的值，a和b会成为0
      }
    }
    return {
      a,
      b,
      sum,
      click
    }
  },
  template:`
    <h1>测试数据：{{a}}+{{b}}={{sum}}</h1>
    <button @click='click'>单击测试</button>`
})
App.mount('#Application') //挂载组件到div
  </script>
</body>
</html>
