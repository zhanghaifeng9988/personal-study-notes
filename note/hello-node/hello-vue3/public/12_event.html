<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event</title>
  <script src="vue.js"></script>
</head>
<body>
  <div id="app1">
    <div>单击次数：{{clickCount}}</div>
    <button @click="handleClick(2,$event)">点击</button>
  </div>
  <div id="app2">
    @click 事件流是默认的冒泡方式
    <div @click="click1" style="border: solid red;">
      外层
        <div @click="click2" style="border: solid blue;">
          中层
          <div @click="click3" style="border: solid green;">
            内层
          </div>
        </div>
    </div>
  </div>
  <div id="app3">
    <!-- capture是捕获 -->
    <div @click.capture="click1"  style="border: solid red;">
      外层
        <div @click.capture="click2" style="border: solid blue;">
          中层
          <div @click.capture="click3" style="border: solid green;">
            内层
          </div>
        </div>
    </div>
  </div>
  <div id="app4">
    <!--  stop是阻止事件冒泡 -->
    <div @click.stop="click1"  style="border: solid red;">
      外层
        <div @click.stop="click2" style="border: solid blue;">
          中层
          <div @click.stop="click3" style="border: solid green;">
            内层
          </div>
        </div>
    </div>
  </div>
  <script>
    const App1 = {
      data() {
        return {
          clickCount: 0
        }
      },
      methods: {
        handleClick(step, event) {
         return this.clickCount += step
          console.log(event)
        }
      }
    }
    Vue.createApp(App1).mount('#app1')

    const App2 = {
      methods: {
        click1() {
          console.log('外层')
        },
        click2() {
          console.log('中层')
        },
        click3() {
          console.log('内层')
        }
      }
    }
    Vue.createApp(App2).mount('#app2')

    const App3 = {
      methods: {
        click1() {
          console.log('外层')
        },
        click2() {
          console.log('中层')
        },
        click3() {
          console.log('内层')
        }
      }
    }
    Vue.createApp(App3).mount('#app3')

    const App4 = {
      methods: {
        click1() {
          console.log('外层')
        },
        click2() {
          console.log('中层')
        },
        click3() {
          console.log('内层')
        }
      }
    }
    Vue.createApp(App4).mount('#app4')
  </script>
</body>
</html>
