<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="vue.js"></script>
</head>
<body>
  <div id="Application">
  </div>
  <script>
    const App = Vue.createApp({
    //进行组件数据的初始化
    //setup()  是在组件实例创建的过程中调用的生命周期钩子。
    //组件挂载前调用。
    //它允许你在组件的逻辑中实现响应式状态、计算属性、侦听器等。
    setup () {
      let myData1 = {
         value:0
       }
      //按钮的单击方式
      function click () {
        myData1.value +=1
        alert(myData1.value)
      }
      //将数据与函数方法返回
      return {
        myData1,
        click
      }
    },
    //模板中可以直接使用setup方法中定义的数据和函数方法
    template:`
    <h1>测试数据：{{myData1.value}}</h1>
    <button @click="click">单击</button>`
  })
  App.mount('#Application')
  </script>
</body>
</html>
