<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>switch</title>
  <script src="vue.js"></script>
</head>
<body>
  <div id="Application">
    <hf-switch @switch-change='change1' switch-style="mini"
     background-color="green" border-color="green" color="green"> </hf-switch>
     <div>开关状态：{{state1}}</div>
     <br/>
     <hf-switch @switch-change='change2' switch-style="mini"
     background-color="blue" border-color="blue" color="blue"> </hf-switch>
     <div>开关状态：{{state2}}</div>
   </div>
  <script>
        const App = Vue.createApp({
      data(){
        return {
          state1:'off',
          state2:'off'
        }
      },
      methods:{
        change1(isOpen){
          this.state1 = isOpen ? 'open':'off'
        },
        change2(isOpen){
          this.state2 = isOpen ? 'open':'off'
        }
      }
    })
    const switchComponent = {
      //定义的外部属性，可以在父组件引用这些属性并给属性赋值
      props:['switchStyle', 'backgroundColor', 'borderColor','color'],
      //内部属性，控制开关状态
      data() {
        return {
          isOpen: false,
          left:'0px'
        }
    },
    //通过计算属性来设置CSS样式
    computed:{
      cssStyleBG:{
        get(){
          if(this.switchStyle == 'mini'){
            return `position:relative;
            border-color:${this.borderColor};
            border-width:2px;
            border-style:solid;
            width:55px;
            height:30px;
            border-radius:30px;
            background-color:${this.isOpen ? this.backgroundColor:'white'};`
          }
          else {
            return `position:relative;
            border-color:${this.borderColor};
            border-width:2px;
            border-style:solid;
            width:55px;
            height:30px;
            border-radius:10px;
            background-color:${this.isOpen ? this.backgroundColor:'white'};`
          }
          }
        },
        cssStyleBtn:{
          get() {
            if (this.switchStyle =='mini') {
              return `position:absolute;
              width:30px;
              height:30px;
              left:${this.left};
              border-radius:50%;
              background-color:${this.color};`
            }
            else {
              return `position:absolute;
              width:30px;
              height:30px;
              left:${this.left};
              border-radius:8px;
              background-color:${this.color};`
            }
          }
        }
      },
      methods:{
        click() {
          this.isOpen = !this.isOpen
          this.left = this.isOpen ? '25px':'0px'
          this.$emit('switch-change',this.isOpen)
        }
      },
      template:
        `<div  :style='cssStyleBG' @click='click'>
          <div  :style='cssStyleBtn'></div>
        </div>`
    }
    App.component('hf-switch',switchComponent)
    App.mount('#Application')
  </script>
</body>
</html>
