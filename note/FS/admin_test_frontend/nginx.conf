server {
    listen 80; # 监听端口
    server_name 192.168.0.111;  # 替换为你的域名或IP地址

    root /usr/share/nginx/html;  # 这是你的vue应用构建输出目录 # 静态文件存放目录
    index index.html; # 索引文件,当用户请求一个目录而不是具体的文件时，Nginx 会自动查找并返回这个索引文件。

    location / {
        try_files $uri $uri/ /index.html; # 尝试访问静态资源，如果找不到则访问index.html,用于history模式
    }

    # 如果你有静态资源需要配置，可以添加以下内容
    location /static/ {
        alias /usr/share/nginx/html/static/;
    }
}